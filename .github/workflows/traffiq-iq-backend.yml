name: TraffIQ IQ backend

on:
  pull_request:
    branches: [main]
    paths:
      - "services/traffiq-iq-backend/**"
      - ".github/workflows/traffiq-iq-backend.yml"
  push:
    branches: [main]
    paths:
      - "services/traffiq-iq-backend/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: services/traffiq-iq-backend
    env:
      DATABASE_URL: postgresql://traffiq:traffiq-ci@localhost:5432/traffiq_ci
      JWT_SECRET: ci-only-traffiq-secret-at-least-32-characters-long
      AUTO_MIGRATE: "false"
    services:
      postgres:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_DB: traffiq_ci
          POSTGRES_USER: traffiq
          POSTGRES_PASSWORD: traffiq-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U traffiq -d traffiq_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax checks
        run: npm run check
      - name: Apply full database migration chain
        run: npm run migrate
      - name: Verify PostGIS extension
        run: |
          node --input-type=module -e "import pg from 'pg'; const c=new pg.Client({connectionString:process.env.DATABASE_URL}); await c.connect(); const r=await c.query(\"SELECT PostGIS_Version() AS version, count(*)::int AS migrations FROM _migrations\"); console.log(r.rows[0]); if(!r.rows[0].version || r.rows[0].migrations < 9) process.exit(1); await c.end();"
      - name: Mobility intelligence contract
        run: npm run test:intelligence
      - name: World export privacy contract
        run: npm run test:world


  mobile_android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Traffiq mobile
        uses: actions/checkout@v4
        with:
          repository: thatlango/traffIQAndroid
          ref: feat/traffiq-mobile-ios-platform
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Install Android platform
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;36.0.0" "platform-tools"
      - name: Create CI local properties
        run: printf 'GOOGLE_MAPS_KEY=ci-placeholder\n' > local.properties
      - name: Unit tests
        run: chmod +x ./gradlew && ./gradlew testDebugUnitTest --stacktrace
      - name: Lint debug
        run: ./gradlew lintDebug --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Verify release build
        run: ./gradlew lintVitalRelease assembleRelease --stacktrace

  mobile_ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Traffiq mobile
        uses: actions/checkout@v4
        with:
          repository: thatlango/traffIQAndroid
          ref: feat/traffiq-mobile-ios-platform
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml
      - name: Build simulator target
        run: >
          xcodebuild
          -project ios/Traffiq.xcodeproj
          -scheme Traffiq
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
