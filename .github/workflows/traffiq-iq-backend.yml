name: TraffIQ IQ backend

on:
  pull_request:
    branches: [main]
    paths:
      - "services/traffiq-iq-backend/**"
      - ".github/workflows/traffiq-iq-backend.yml"
  push:
    branches: [main]
    paths:
      - "services/traffiq-iq-backend/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/traffiq-iq-backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax checks
        run: npm run check
