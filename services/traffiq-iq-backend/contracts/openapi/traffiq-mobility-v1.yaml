openapi: 3.1.0
info:
  title: Traffiq Mobility Intelligence API
  version: 2026-09-28.v3
  description: Backend-first journey, spatial and community intelligence contract shared by web, Android and iOS.
servers:
  - url: https://api.traffiq.tukutuku.org/v1
security:
  - bearerAuth: []
paths:
  /intelligence/capabilities:
    get:
      security: []
      operationId: getMobilityCapabilities
      responses:
        '200':
          description: Mobility platform capabilities.
  /geo/search:
    get:
      operationId: searchPlaces
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 200 } }
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 10, default: 8 } }
      responses:
        '200':
          description: Ranked destination search results.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/PlaceSearchResult' }
  /vehicles:
    get:
      operationId: listVehicles
      responses:
        '200': { description: Vehicles }
    post:
      operationId: upsertVehicle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleInput' }
      responses:
        '201': { description: Vehicle saved }
  /journey-plans:
    post:
      operationId: createJourneyPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JourneyPlanInput' }
      responses:
        '201':
          description: Intelligent journey plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JourneyPlanBundle' }
  /journey-plans/{id}:
    get:
      operationId: getJourneyPlan
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Intelligent journey plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JourneyPlanBundle' }
  /journey-plans/{id}/select-route:
    post:
      operationId: selectJourneyRoute
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [routeId]
              properties:
                routeId: { type: string, format: uuid }
      responses:
        '200': { description: Updated plan }
  /journey-plans/{id}/replan:
    post:
      operationId: replanJourney
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origin]
              properties:
                origin: { $ref: '#/components/schemas/Coordinate' }
                departureAt: { type: string, format: date-time }
                force: { type: boolean, default: false }
      responses:
        '200':
          description: Replanned journey bundle, or the current bundle when still on route.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/JourneyPlanBundle' }
                  - type: object
                    properties:
                      replan:
                        type: object
                        required: [replanned, reason]
                        properties:
                          replanned: { type: boolean }
                          offRouteDistanceM: { type: number }
                          reason: { type: string, enum: [still_on_route, off_route, route_missing] }
  /journey-plans/{id}/recommendations/refresh:
    post:
      operationId: refreshJourneyRecommendations
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Updated recommendations and risk }
  /journey-plans/{id}/activate:
    post:
      operationId: activateJourneyPlan
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [journeyClientId]
              properties:
                journeyClientId: { type: string, format: uuid }
      responses:
        '201':
          description: Active canonical journey.
          content:
            application/json:
              schema:
                type: object
                required: [journey, plan]
                properties:
                  journey: { $ref: '#/components/schemas/ActivatedJourney' }
                  plan: { type: object, additionalProperties: true }
  /journeys/{id}/points:
    post:
      operationId: uploadJourneyPoints
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JourneyPointBatch' }
      responses:
        '202':
          description: Journey points accepted idempotently.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JourneyPointBatchResponse' }
  /journeys/{id}/end:
    post:
      operationId: endJourney
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Completed journey.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivatedJourney' }
  /observations:
    post:
      operationId: reportMobilityObservation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ObservationInput' }
      responses:
        '201': { description: New observation }
        '200': { description: Report merged into a matching observation }
  /observations/nearby:
    get:
      operationId: listNearbyObservations
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lng, in: query, required: true, schema: { type: number } }
        - { name: radiusM, in: query, schema: { type: integer, minimum: 100, maximum: 50000 } }
        - { name: types, in: query, schema: { type: string } }
      responses:
        '200': { description: Nearby current observations }
  /observations/{id}/vote:
    put:
      operationId: voteOnObservation
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vote]
              properties:
                vote: { type: string, enum: [confirm, dispute, clear] }
      responses:
        '200': { description: Observation confidence and state updated }
  /client-events/batch:
    post:
      operationId: syncClientEvents
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientEventBatch' }
      responses:
        '202': { description: Idempotent event batch accepted }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Coordinate:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        name: { type: string }
    PlaceSearchResult:
      type: object
      required: [id, name, lat, lng]
      properties:
        id: { type: string }
        name: { type: string }
        displayName: { type: string }
        detail: { type: string }
        formatted_address: { type: string }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        type: { type: string }
        category: { type: string }
        source: { type: string }
    VehicleInput:
      type: object
      required: [clientId, displayName]
      properties:
        clientId: { type: string, format: uuid }
        displayName: { type: string }
        make: { type: string }
        model: { type: string }
        fuelType: { type: string, enum: [petrol, diesel, hybrid, electric, other] }
        tankCapacityL: { type: number }
        expectedConsumptionLPer100Km: { type: number }
        currentFuelPct: { type: number, minimum: 0, maximum: 100 }
        estimatedRangeKm: { type: number }
        serviceDueKm: { type: number }
        metadata: { type: object, additionalProperties: true }
    JourneyPlanInput:
      type: object
      required: [clientId, mode, origin, destination]
      properties:
        clientId: { type: string, format: uuid }
        mode: { type: string, enum: [car, motorcycle, taxi, bus, truck, bicycle, walking, other] }
        origin: { $ref: '#/components/schemas/Coordinate' }
        destination: { $ref: '#/components/schemas/Coordinate' }
        departureAt: { type: string, format: date-time }
        vehicleId: { type: string, format: uuid }
        travellerContext: { type: object, additionalProperties: true }
        preferences: { type: object, additionalProperties: true }
    JourneyPlanBundle:
      type: object
      required: [plan, routes, stops, intelligence]
      properties:
        plan: { type: object, additionalProperties: true }
        routes:
          type: array
          items: { type: object, additionalProperties: true }
        stops:
          type: array
          items: { type: object, additionalProperties: true }
        intelligence:
          type: object
          additionalProperties: true
    ActivatedJourney:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        client_id: { type: string, format: uuid }
        status: { type: string }
        mode: { type: string }
        destination_name: { type: string }
        destination_lat: { type: number }
        destination_lng: { type: number }
        journey_plan_id: { type: string, format: uuid }
    JourneyPoint:
      type: object
      required: [id, lat, lng, recordedAt]
      properties:
        id: { type: string, format: uuid }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        accuracyM: { type: number, minimum: 0, maximum: 10000 }
        speedMps: { type: number, minimum: 0, maximum: 150 }
        bearingDeg: { type: number, minimum: 0, maximum: 360 }
        altitudeM: { type: number, minimum: -1000, maximum: 12000 }
        recordedAt: { type: string, format: date-time }
        source: { type: string, enum: [gps, network, manual] }
    JourneyPointBatch:
      type: object
      required: [points]
      properties:
        points:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/JourneyPoint' }
    JourneyPointBatchResponse:
      type: object
      required: [accepted, duplicateOrExisting, journey]
      properties:
        accepted: { type: integer, minimum: 0 }
        duplicateOrExisting: { type: integer, minimum: 0 }
        journey: { $ref: '#/components/schemas/ActivatedJourney' }
    ObservationInput:
      type: object
      required: [clientId, type, lat, lng, observedAt]
      properties:
        clientId: { type: string, format: uuid }
        journeyId: { type: string, format: uuid }
        type:
          type: string
          enum: [crash, traffic, pothole, flooding, roadblock, roadworks, broken_vehicle, debris, bad_road, fuel_unavailable, police_checkpoint, unsafe_area, road_closure, animal, harsh_braking, slowdown, road_damage, other]
        source: { type: string, enum: [community, sensor] }
        severity: { type: string, enum: [low, medium, high, critical] }
        lat: { type: number }
        lng: { type: number }
        headingDeg: { type: number }
        direction: { type: string }
        description: { type: string }
        observedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        evidence:
          type: array
          items: { type: object, additionalProperties: true }
        metadata: { type: object, additionalProperties: true }
    ClientEventBatch:
      type: object
      required: [events]
      properties:
        deviceId: { type: string, format: uuid }
        events:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [id, type, occurredAt]
            properties:
              id: { type: string, format: uuid }
              type: { type: string }
              occurredAt: { type: string, format: date-time }
              payload: { type: object, additionalProperties: true }
