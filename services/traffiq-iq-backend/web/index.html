<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TraffIQ</title><meta name="theme-color" content="#16072d">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--p:#16072d;--p2:#251043;--l:#9bea45;--t:#fff;--m:#c2b6cf;--r:#ff6d76}*{box-sizing:border-box}html,body,#map{height:100%;margin:0}body{font:14px system-ui;background:var(--p);color:#fff;overflow:hidden}.hidden{display:none!important}#map{position:fixed;inset:0}.ui{position:fixed;inset:0;z-index:500;pointer-events:none}.top{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:8px}.brand,.search,.btn,.panel,.drawer{pointer-events:auto}.brand{background:#16072df2;border:1px solid #ffffff1a;border-radius:14px;padding:11px 14px;font-weight:900}.brand b{color:var(--l)}.search{display:flex;flex:1;max-width:620px;background:#16072df2;border:1px solid #ffffff1a;border-radius:14px;overflow:hidden}.search input{flex:1;border:0;background:none;color:#fff;padding:12px;outline:0}.search button,.btn.primary{background:var(--l);color:var(--p)}button{cursor:pointer}.btn{border:0;border-radius:12px;padding:11px 13px;font-weight:800;background:var(--p2);color:#fff}.bottom{position:absolute;bottom:14px;left:14px;right:14px;display:flex;justify-content:center}.panel{width:min(760px,100%);background:#16072df5;border:1px solid #ffffff1a;border-radius:22px;padding:14px}.pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.pill{font-size:11px;padding:6px 8px;border-radius:999px;background:#ffffff12;color:var(--m)}.live{color:var(--l);background:#9bea4520}.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.drawer{position:absolute;right:14px;top:70px;width:min(330px,calc(100vw - 28px));max-height:70vh;overflow:auto;background:#16072df7;border:1px solid #ffffff1a;border-radius:18px;padding:14px}.row{background:#ffffff0d;border-radius:11px;padding:10px;margin:6px 0}.row small{color:var(--m)}.auth{position:fixed;inset:0;z-index:2000;background:radial-gradient(circle at 20% 10%,#40237a,#16072d 55%);display:grid;place-items:center;padding:18px}.card{width:min(420px,100%);background:#251043f5;border:1px solid #ffffff1a;border-radius:24px;padding:26px}.card h1{font-size:32px;margin:0}.card h1 b{color:var(--l)}.card p{color:var(--m)}.field{width:100%;padding:12px;margin:5px 0;border:1px solid #ffffff1a;border-radius:11px;background:#ffffff0b;color:#fff}.tabs{display:flex;background:#ffffff0b;padding:4px;border-radius:11px;margin:16px 0}.tabs button{flex:1;border:0;border-radius:8px;padding:8px;background:none;color:var(--m);font-weight:800}.tabs .on{background:#fff;color:var(--p)}.error{color:#ffb1b5;font-size:12px;margin-top:8px}.toast{position:fixed;z-index:3000;top:18px;left:50%;transform:translateX(-50%);background:#fff;color:var(--p);padding:9px 13px;border-radius:999px;font-weight:800}@media(max-width:650px){.brand{display:none}.actions{grid-template-columns:repeat(3,1fr)}}
</style></head>
<body><div id="map"></div>
<div class="ui" id="ui"><div class="top"><div class="brand">TRAFF<b>IQ</b></div>
<form class="search" id="search"><input id="q" placeholder="Where are you going?"><button class="btn primary">Search</button></form><button class="btn" id="menu">☰</button></div>
<div class="drawer hidden" id="drawer"><h3>Your TraffIQ</h3><div class="row" id="user"></div><button class="btn" style="width:100%" id="save">Save current place</button><div id="places"></div><button class="btn" style="width:100%;margin-top:10px;color:#ff9ca2" id="logout">Sign out</button></div>
<div class="bottom"><div class="panel"><div class="pills"><span class="pill" id="loc">Finding location…</span><span class="pill" id="traffic">Traffic: checking</span><span class="pill" id="journey">No active journey</span></div>
<div class="actions"><button class="btn primary" id="start">Start journey</button><button class="btn" id="report">Report</button><button class="btn" id="share">Share</button><button class="btn" id="center">My location</button><button class="btn" id="refresh">Refresh</button></div></div></div></div>
<div class="auth" id="auth"><div class="card"><h1>TRAFF<b>IQ</b></h1><p>Live road intelligence built from real journeys.</p>
<div class="tabs"><button id="tlogin" class="on">Sign in</button><button id="tsignup">Create account</button></div>
<input class="field hidden" id="name" placeholder="Full name"><input class="field" id="email" type="email" placeholder="Email address"><input class="field" id="pass" type="password" placeholder="Password (8+ characters)">
<button class="btn primary" style="width:100%;margin-top:7px" id="authbtn">Sign in</button><div class="error" id="err"></div></div></div><div class="toast hidden" id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const API='https://api.traffiq.tukutuku.org',KEY='traffiq.web.session.v1';let mode='login',s=null,map,me,destM,incs,cur=null,dest=null,j=null,seq=0,busy=false;
const $=x=>document.getElementById(x),un=x=>x&&Object.prototype.hasOwnProperty.call(x,'data')?x.data:x;
function toast(x){$('toast').textContent=x;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2400)}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}} function saveS(x){s=x;x?localStorage.setItem(KEY,JSON.stringify(x)):localStorage.removeItem(KEY)}
function iid(){let x=localStorage.getItem('traffiq.web.installation.v1');if(!x){x=crypto.randomUUID();localStorage.setItem('traffiq.web.installation.v1',x)}return x}
async function req(path,o={}){let h={...(o.headers||{})};if(o.body)h['Content-Type']='application/json';if(o.auth!==false&&s?.accessToken)h.Authorization='Bearer '+s.accessToken;let r=await fetch(API+path,{...o,headers:h,body:o.body?JSON.stringify(o.body):undefined});if(r.status===401&&s?.refreshToken&&!o.retry){let z=await fetch(API+'/v1/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refreshToken:s.refreshToken})});if(z.ok){let n=await z.json();saveS({...s,...n,user:s.user});return req(path,{...o,retry:true})}}let b=await r.json().catch(()=>null);if(!r.ok)throw Error(b?.error?.message||b?.message||'Request failed');return un(b)}
function setMode(x){mode=x;$('tlogin').classList.toggle('on',x==='login');$('tsignup').classList.toggle('on',x==='signup');$('name').classList.toggle('hidden',x!=='signup');$('authbtn').textContent=x==='login'?'Sign in':'Create account'}
async function auth(){try{$('err').textContent='';let email=$('email').value.trim(),password=$('pass').value;if(password.length<8)throw Error('Use at least 8 characters.');let body=mode==='login'?{email,password,device:{installationId:iid(),platform:'web'}}:{email,password,displayName:$('name').value.trim()||email.split('@')[0],device:{installationId:iid(),platform:'web'}};saveS(await req(mode==='login'?'/v1/auth/login':'/v1/auth/register',{method:'POST',body,auth:false}));boot()}catch(e){$('err').textContent=e.message}}
function init(){map=L.map('map',{zoomControl:false}).setView([0.3476,32.5825],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);L.control.zoom({position:'bottomright'}).addTo(map);incs=L.layerGroup().addTo(map)}
async function boot(){s=load();$('auth').classList.toggle('hidden',!!s);$('ui').classList.toggle('hidden',!s);if(!s)return;$('user').innerHTML='<b>'+(s.user?.displayName||s.user?.email||'TraffIQ user')+'</b><br><small>'+(s.user?.email||'')+'</small>';locate();await Promise.allSettled([places(),active()])}
function locate(){navigator.geolocation?.watchPosition(p=>{cur={lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy,speed:p.coords.speed,heading:p.coords.heading};$('loc').textContent='Location synced';$('loc').classList.add('live');if(!me){me=L.circleMarker([cur.lat,cur.lng],{radius:8,color:'#16072d',fillColor:'#9bea45',fillOpacity:1,weight:3}).addTo(map);map.setView([cur.lat,cur.lng],15)}else me.setLatLng([cur.lat,cur.lng]);if(j)point();nearby();traffic()},()=>{$('loc').textContent='Location permission needed'},{enableHighAccuracy:true,maximumAge:8000,timeout:15000})}
async function search(q){try{let x=await req('/v1/geo/search?q='+encodeURIComponent(q)+(cur?'&lat='+cur.lat+'&lng='+cur.lng:'')),a=x.places||x.results||x,r=a[0];if(!r)throw Error('No matching place found');let lat=+r.lat||+r.latitude,lng=+r.lng||+r.lon||+r.longitude;dest={lat,lng,label:r.name||r.displayName||r.display_name||q};destM&&destM.remove();destM=L.marker([lat,lng]).addTo(map).bindPopup('<b>'+dest.label+'</b>').openPopup();map.setView([lat,lng],15);toast('Destination set')}catch(e){toast(e.message)}}
async function active(){try{j=await req('/mobile/v1/journeys/active')}catch{}uj()}
function uj(){$('journey').textContent=j?'Journey active':'No active journey';$('journey').classList.toggle('live',!!j);$('start').textContent=j?'End journey':'Start journey'}
async function toggle(){try{if(j){await req('/mobile/v1/journeys/'+j.id+'/end',{method:'POST',body:{ended_at:new Date().toISOString()}});j=null;uj();toast('Journey completed');return}if(!cur)return toast('Waiting for location');j=await req('/mobile/v1/journeys',{method:'POST',body:{client_journey_id:crypto.randomUUID(),vehicle:'car',purpose:'personal',origin_lat:cur.lat,origin_lng:cur.lng,origin_label:'Current location',destination_lat:dest?.lat??null,destination_lng:dest?.lng??null,destination_label:dest?.label??null,started_at:new Date().toISOString()}});uj();point();toast('Journey started')}catch(e){toast(e.message)}}
async function point(){if(!j||!cur)return;try{await req('/mobile/v1/journeys/'+j.id+'/locations',{method:'POST',body:{points:[{client_point_id:'web-'+Date.now()+'-'+(++seq),lat:cur.lat,lng:cur.lng,accuracy:cur.accuracy,speed:cur.speed,heading:cur.heading,recorded_at:new Date().toISOString()}]}})}catch{}}
async function nearby(){if(!cur||busy)return;busy=true;try{let a=await req('/mobile/v1/incidents/nearby?lat='+cur.lat+'&lng='+cur.lng+'&radius_m=10000');incs.clearLayers();(a||[]).forEach(i=>L.circleMarker([+i.lat,+i.lng],{radius:7,color:'#fff',weight:2,fillColor:'#ff6d76',fillOpacity:.9}).addTo(incs).bindPopup('<b>'+i.type+'</b><br>'+(i.note||'Road incident')))}catch{}finally{busy=false}}
async function traffic(){if(!cur||traffic.busy)return;traffic.busy=1;try{let x=await req('/mobile/v1/traffic/snapshot?lat='+cur.lat+'&lng='+cur.lng+'&radius_m=2500');$('traffic').textContent='Traffic: '+(x.traffic_state||'learning')}catch{}setTimeout(()=>traffic.busy=0,10000)}
async function report(){if(!cur)return toast('Waiting for location');let type=(prompt('Incident type: accident, traffic, police, hazard, closure, construction','hazard')||'').toLowerCase();if(!type)return;try{await req('/mobile/v1/incidents',{method:'POST',body:{client_incident_id:crypto.randomUUID(),journey_id:j?.id||null,type,severity:'medium',lat:cur.lat,lng:cur.lng,note:prompt('Short note','')||'',observed_at:new Date().toISOString()}});toast('Incident reported');nearby()}catch(e){toast(e.message)}}
async function share(){if(!j)return toast('Start a journey first');try{let x=await req('/mobile/v1/journeys/'+j.id+'/shares',{method:'POST',body:{}}),u=x.share_url||location.origin+'/share/'+x.token;if(navigator.share)await navigator.share({title:'My TraffIQ journey',url:u});else{await navigator.clipboard.writeText(u);toast('Share link copied')}}catch(e){toast(e.message)}}
async function places(){try{let a=await req('/mobile/v1/saved-places');$('places').innerHTML='<h3>Saved places</h3>'+((a||[]).map(p=>'<div class="row"><b>'+esc(p.name||p.label)+'</b><br><small>'+esc(p.formatted_address||'')+'</small></div>').join('')||'<div class="row"><small>No saved places yet.</small></div>')}catch{}}
async function savePlace(){if(!cur)return toast('Waiting for location');let label=prompt('Name this place','My place');if(!label)return;try{await req('/mobile/v1/saved-places',{method:'POST',body:{label,kind:'custom',formatted_address:label,lat:cur.lat,lng:cur.lng,source:'manual'}});toast('Place saved');places()}catch(e){toast(e.message)}}
function esc(x){return String(x||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}
async function pub(){let m=location.pathname.match(/^\/share\/([^/]+)/);if(!m)return false;$('auth').classList.add('hidden');$('ui').classList.add('hidden');try{let x=await req('/mobile/v1/shared-trips/'+encodeURIComponent(m[1]),{auth:false}),lat=+x.lat,lng=+x.lng;if(Number.isFinite(lat)&&Number.isFinite(lng)){L.marker([lat,lng]).addTo(map).bindPopup('<b>'+(x.display_name||'Shared journey')+'</b><br>'+x.status).openPopup();map.setView([lat,lng],15)}if(x.route?.length>1)L.polyline(x.route.map(p=>[+p.lat,+p.lng]),{color:'#6e37a8',weight:5}).addTo(map)}catch{toast('This share is unavailable')}return true}
$('tlogin').onclick=()=>setMode('login');$('tsignup').onclick=()=>setMode('signup');$('authbtn').onclick=auth;$('search').onsubmit=e=>{e.preventDefault();search($('q').value.trim())};$('menu').onclick=()=>{$('drawer').classList.toggle('hidden');places()};$('logout').onclick=async()=>{try{s?.refreshToken&&await req('/v1/auth/logout',{method:'POST',body:{refreshToken:s.refreshToken},auth:false})}catch{}saveS(null);location.reload()};$('start').onclick=toggle;$('report').onclick=report;$('share').onclick=share;$('center').onclick=()=>cur&&map.setView([cur.lat,cur.lng],16);$('refresh').onclick=()=>{nearby();traffic();toast('Road data refreshed')};$('save').onclick=savePlace;
init();pub().then(x=>{if(!x)boot()});
</script></body></html>
