services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 10000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUTO_MIGRATE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "10000"
    networks:
      - traffiq_internal

  mobile:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "src/mobile-server.js"]
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      MOBILE_PORT: 10001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUTO_MIGRATE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "10001"
    networks:
      - traffiq_internal

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - traffiq_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - traffiq_internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      mobile:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - traffiq_caddy_data:/data
      - traffiq_caddy_config:/config
    networks:
      - traffiq_internal

volumes:
  traffiq_postgres_data:
  traffiq_caddy_data:
  traffiq_caddy_config:

networks:
  traffiq_internal:
    driver: bridge
