# No build step — index.html uses Tailwind CDN, everything is self-contained.
# Netlify just serves this folder directly.
[build]
  publish = "artifacts/landing"
  base    = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
